server {
    listen 80;
    server_name 13.50.238.7;

    client_max_body_size 6000M;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    server_name wiut.orifdev.uz www.wiut.orifdev.uz;
    client_max_body_size 6000M;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wiut.orifdev.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiut.orifdev.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.wiut.orifdev.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = wiut.orifdev.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name wiut.orifdev.uz www.wiut.orifdev.uz;
    return 404; # managed by Certbot
}
